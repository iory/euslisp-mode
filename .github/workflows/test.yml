name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs_version:
          - '27.2'
          - '28.2'
          - '29.1'
        include:
          - os: ubuntu-latest
            emacs_version: 'snapshot'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Emacs
      uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - name: Cache ELPA packages
      uses: actions/cache@v3
      with:
        path: ~/.emacs.d/elpa
        key: ${{ runner.os }}-emacs-${{ matrix.emacs_version }}-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-emacs-${{ matrix.emacs_version }}-
          ${{ runner.os }}-emacs-

    - name: Install dependencies
      run: |
        emacs --batch \
          --eval "(require 'package)" \
          --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
          --eval "(package-initialize)" \
          --eval "(package-refresh-contents)" \
          --eval "(package-install 'helm)" \
          --eval "(package-install 's)" \
          --eval "(package-install 'exec-path-from-shell)"

    - name: Byte compile
      run: make compile

    - name: Run tests
      run: make test

    - name: Check package lint
      if: matrix.emacs_version != 'snapshot'
      run: make lint